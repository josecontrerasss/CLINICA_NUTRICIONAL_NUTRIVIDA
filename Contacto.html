<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto | NutriVida</title>
    <link rel="stylesheet" href="styleLogin.css">
</head>
<body>
    
    <div class="login" style="width: 450px; margin-top: 40px; margin-bottom: 40px;">
        
        <h1>Contacto</h1>
        <p style="font-size: 14px; color: #555; margin-bottom: 20px;">Envíanos tus dudas o consultas y te responderemos a la brevedad.</p>

        <label>Nombre:</label>
        <input type="text" id="nombre" maxlength="100" placeholder="Tu nombre completo">
        <span id="error-nombre" style="color: red; font-size: 12px; display: block;"></span>
        <br>

        <label>Correo Electrónico:</label>
        <input type="email" id="correo" maxlength="100" placeholder="ejemplo@correo.cl">
        <span id="error-correo" style="color: red; font-size: 12px; display: block;"></span>
        <br>

        <label>Comentario o Mensaje:</label>
        <textarea id="comentario" maxlength="500" placeholder="Escribe tu mensaje aquí..." style="width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: none;"></textarea>
        <span id="error-comentario" style="color: red; font-size: 12px; display: block;"></span>
        <br>

        <button onclick="enviarMensaje()">Enviar Mensaje</button>
        
        <br><br>
        <a href="index.html">Volver al Inicio</a>

    </div>

    <script src="contacto.js"></script>
</body>
</html>
